x2="800" y2="820" stroke="#e2e8f0" stroke-width="0.75"/><line x1="50" y1="848" x2="800" y2="848" stroke="#e2e8f0" stroke-width="0.75"/><line x1="50" y1="876" x2="800" y2="876" stroke="#e2e8f0" stroke-width="0.75"/><line x1="50" y1="904" x2="800" y2="904" stroke="#e2e8f0" stroke-width="0.75"/><line x1="50" y1="932" x2="800" y2="932" stroke="#e2e8f0" stroke-width="0.75"/><line x1="50" y1="960" x2="800" y2="960" stroke="#e2e8f0" stroke-width="0.75"/><line x1="50" y1="988" x2="800" y2="988" stroke="#e2e8f0" stroke-width="0.75"/>
