  <!-- Title Header -->
  <text x="425" y="65" class="heading" font-size="20" text-anchor="middle">Task F: Simple Handwritten Backpropagation</text>
  <text x="425" y="88" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Pass Science Works | Candidate ID: RA2311047010144 | Page 1 of 2</text>

  <!-- Problem Setup Box -->
  <rect x="110" y="115" width="670" height="75" class="box"/>
  <text x="125" y="138" class="handwriting" font-size="14" font-weight="bold">Given Sample &amp; Architecture:</text>
  <text x="125" y="160" class="handwriting" font-size="14">Sample: x = 1,  Target: y = 2  |  Initial: w = 0.5, b = 0.0, v = 1.0, c = 0.0,  η = 0.1</text>
  <text x="125" y="178" class="handwriting" font-size="13">Equations: z = w·x + b,  h = tanh(z),  y_hat = v·h + c,  Loss J = 0.5(y_hat - y)²</text>

  <!-- Section 1: Forward Pass -->
  <text x="110" y="222" class="heading" font-size="16">1. Forward Pass Calculation (Step 0)</text>
  
  <text x="125" y="250" class="handwriting" font-size="14">1) Linear combination:  z = w·x + b = (0.5)(1) + 0 = 0.5</text>
  <text x="125" y="278" class="handwriting" font-size="14">2) Activation:  h = tanh(z) = tanh(0.5) = (e^0.5 - e^-0.5)/(e^0.5 + e^-0.5)</text>
  <text x="160" y="306" class="handwriting" font-size="15" font-weight="bold" fill="#0369a1">→ h = 0.462117157</text>

  <text x="125" y="334" class="handwriting" font-size="14">3) Output prediction:  y_hat = v·h + c = (1.0)(0.462117157) + 0</text>
  <text x="160" y="362" class="handwriting" font-size="15" font-weight="bold" fill="#0369a1">→ y_hat = 0.462117157</text>

  <text x="125" y="390" class="handwriting" font-size="14">4) Residual Error:  e = y_hat - y = 0.462117157 - 2.0 = -1.537882843</text>
  <text x="125" y="418" class="handwriting" font-size="14">5) Squared Loss:  J = 0.5 · e² = 0.5 · (-1.537882843)²</text>
  <text x="160" y="446" class="handwriting" font-size="15" font-weight="bold" fill="#b91c1c">→ Initial Loss J = 1.182541818</text>

  <!-- Section 2: Chain Rule Derivatives -->
  <text x="110" y="490" class="heading" font-size="16">2. Analytical Chain-Rule Gradient Derivations</text>

  <!-- Output Layer Derivatives -->
  <rect x="110" y="505" width="670" height="150" class="box"/>
  <text x="125" y="528" class="handwriting" font-size="14" font-weight="bold" fill="#0f172a">A. Output Layer: (c and v)</text>
  <text x="140" y="554" class="handwriting" font-size="14">• ∂J/∂y_hat = y_hat - y = -1.537882843</text>
  <text x="140" y="582" class="handwriting" font-size="14">• ∂J/∂c = (∂J/∂y_hat) · (∂y_hat/∂c) = (y_hat - y) · 1</text>
  <text x="175" y="608" class="handwriting" font-size="15" font-weight="bold" fill="#1d4ed8">→ ∂J/∂c = -1.537882843</text>
  <text x="140" y="632" class="handwriting" font-size="14">• ∂J/∂v = (∂J/∂y_hat) · (∂y_hat/∂v) = (y_hat - y) · h = (-1.537882843)(0.462117157)</text>
  <text x="175" y="650" class="handwriting" font-size="15" font-weight="bold" fill="#1d4ed8">→ ∂J/∂v = -0.710682054</text>

  <!-- Hidden Layer Backpropagation -->
  <rect x="110" y="675" width="670" height="235" class="box"/>
  <text x="125" y="698" class="handwriting" font-size="14" font-weight="bold" fill="#0f172a">B. Hidden Layer Backpropagation: (w and b)</text>
  <text x="140" y="724" class="handwriting" font-size="14">• Sensitivity to h:  ∂J/∂h = (∂J/∂y_hat) · (∂y_hat/∂h) = (y_hat - y) · v = -1.537882843</text>
  <text x="140" y="752" class="handwriting" font-size="14">• Activation derivative:  dh/dz = 1 - tanh²(z) = 1 - h²</text>
  <text x="175" y="776" class="handwriting" font-size="14">  dh/dz = 1 - (0.462117157)² = 1 - 0.213552267 = 0.786447733</text>
  <text x="140" y="804" class="handwriting" font-size="14">• Pre-activation gradient:  ∂J/∂z = (∂J/∂h) · (dh/dz) = (-1.537882843)(1.0)(0.786447733)</text>
  <text x="175" y="828" class="handwriting" font-size="14" font-weight="bold">  ∂J/∂z = -1.209464523</text>
  <text x="140" y="856" class="handwriting" font-size="14">• ∂J/∂w = (∂J/∂z) · (∂z/∂w) = (∂J/∂z) · x = (-1.209464523)(1)</text>
  <text x="175" y="880" class="handwriting" font-size="15" font-weight="bold" fill="#1d4ed8">→ ∂J/∂w = -1.209464523</text>
  <text x="140" y="904" class="handwriting" font-size="14">• ∂J/∂b = (∂J/∂z) · (∂z/∂b) = (∂J/∂z) · 1</text>
  <text x="175" y="922" class="handwriting" font-size="15" font-weight="bold" fill="#1d4ed8">→ ∂J/∂b = -1.209464523</text>

  <!-- Footer -->
  <text x="750" y="1030" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">Page 1 of 2 [Continued on Page 2]</text>
