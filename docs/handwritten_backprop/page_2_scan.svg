  <!-- Section 5: Explanation of Gradient Direction -->
  <text x="110" y="600" class="heading" font-size="16">5. Explanation of Gradient Direction &amp; Dynamics</text>
  
  <rect x="110" y="615" width="670" height="280" class="box"/>
  <text x="125" y="640" class="handwriting" font-size="14" font-weight="bold" fill="#0f172a">Why are all initial gradients strictly negative?</text>
  <text x="125" y="668" class="handwriting" font-size="14">1. Model underprediction: The current output is y_hat ≈ 0.462, but target is y = 2.0.</text>
  <text x="125" y="694" class="handwriting" font-size="14">   Thus residual e = y_hat - y = -1.5379 is negative.</text>
  <text x="125" y="722" class="handwriting" font-size="14">2. Positive chain terms: v = 1.0 &gt; 0, h ≈ 0.462 &gt; 0, and (1 - h²) ≈ 0.786 &gt; 0.</text>
  <text x="125" y="748" class="handwriting" font-size="14">   All multiplicative chain-rule factors are positive, making all 4 derivatives negative:</text>
  <text x="150" y="774" class="handwriting" font-size="14" font-weight="bold" fill="#b91c1c">   ∂J/∂w &lt; 0,   ∂J/∂b &lt; 0,   ∂J/∂v &lt; 0,   ∂J/∂c &lt; 0</text>
  <text x="125" y="804" class="handwriting" font-size="14">3. Optimization direction: Gradient ∇J points toward increasing loss.</text>
  <text x="125" y="830" class="handwriting" font-size="14">   Descent moves in opposite direction (-∇J), resulting in POSITIVE parameter updates.</text>
  <text x="125" y="856" class="handwriting" font-size="14">   Increasing w, b, v, and c pushes y_hat upwards towards target 2.0.</text>
  <text x="125" y="882" class="handwriting" font-size="14">4. 100-Step dynamics: Loss drops monotonically from 1.1825 to &lt; 10⁻⁶ without oscillation.</text>

  <text x="750" y="1030" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">Page 2 of 2 [Complete Derivation]</text>
