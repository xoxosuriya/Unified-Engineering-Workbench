  <text x="425" y="65" class="heading" font-size="20" text-anchor="middle">Task F: Simple Handwritten Backpropagation</text>
  <text x="425" y="88" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Pass Science Works | R&amp;D Internship Assessment | Page 2 of 2</text>

  <!-- Section 3: Simultaneous Parameter Update -->
  <text x="110" y="130" class="heading" font-size="16">3. Simultaneous Gradient Descent Parameter Update</text>
  <text x="125" y="156" class="handwriting" font-size="14">Update Rule:  θ_new = θ_old - η · (∂J/∂θ)   with learning rate η = 0.1</text>

  <rect x="110" y="175" width="670" height="150" class="highlight"/>
  <text x="130" y="202" class="handwriting" font-size="15">• w_new = 0.5 - (0.1)(-1.209464523) = 0.5 + 0.120946452  = <tspan font-weight="bold" fill="#15803d">0.620946452</tspan></text>
  <text x="130" y="235" class="handwriting" font-size="15">• b_new = 0.0 - (0.1)(-1.209464523) = 0.0 + 0.120946452  = <tspan font-weight="bold" fill="#15803d">0.120946452</tspan></text>
  <text x="130" y="268" class="handwriting" font-size="15">• v_new = 1.0 - (0.1)(-0.710682054) = 1.0 + 0.071068205  = <tspan font-weight="bold" fill="#15803d">1.071068205</tspan></text>
  <text x="130" y="301" class="handwriting" font-size="15">• c_new = 0.0 - (0.1)(-1.537882843) = 0.0 + 0.153788284  = <tspan font-weight="bold" fill="#15803d">0.153788284</tspan></text>

  <!-- Section 4: Finite Difference Check -->
  <text x="110" y="360" class="heading" font-size="16">4. Numerical Gradient Check via Central Differences (ε = 10⁻⁶)</text>
  <text x="125" y="386" class="handwriting" font-size="14">Formula:  [∂J/∂θ]_FD = [ J(θ + ε) - J(θ - ε) ] / (2ε)    | Tolerance ≤ 10⁻⁵</text>

